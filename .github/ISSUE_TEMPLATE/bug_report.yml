name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Magento/Mage-OS, PHP, this module, Hyvä (if relevant)
      placeholder: "Magento 2.4.8-p5, PHP 8.3, module 1.0.0, Hyvä 1.4.2"
    validations:
      required: true
  - type: dropdown
    id: csp
    attributes:
      label: CSP mode on the storefront
      options: [report-only, enforce, unknown]
  - type: dropdown
    id: varnish
    attributes:
      label: Full page cache
      options: [built-in, Varnish, none, unknown]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
